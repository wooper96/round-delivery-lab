name: Publish PokéPairings website

on:
  push:
    # Every new head must queue a run, including edits outside the published site.
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pokepairings-pages
  cancel-in-progress: false
  # A rerun of an older commit must not displace a newer pending deploy.
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip outdated runs before preparing the site
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer commit replaced this deployment.'
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.freshness.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.freshness.outputs.current == 'true'
      - name: Package website and tournament data
        if: steps.freshness.outputs.current == 'true'
        run: python3 .github/scripts/package-pages.py "$RUNNER_TEMP/league-site"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        id: upload
        if: steps.freshness.outputs.current == 'true'
        with:
          path: ${{ runner.temp }}/league-site
      - name: Wait for the Pages artifact
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
                | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 1
          done
          echo 'GitHub did not list the uploaded Pages artifact' >&2
          exit 1
      - name: Verify Pages source and current commit
        id: eligibility
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo '::notice::A newer commit replaced this deployment.'
            exit 0
          fi
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$mode" != 'workflow' ]; then
            echo '::error::Set the GitHub Pages source to GitHub Actions before deploying.'
            exit 1
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - name: Deploy website
        if: steps.eligibility.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
